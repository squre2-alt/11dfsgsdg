name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build unsigned IPA for TrollStore
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build IPA
        run: |
          chmod +x build-ipa-macos.sh
          ./build-ipa-macos.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GateLAN-ipa
          path: GateLAN.ipa
          if-no-files-found: error
