name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build unsigned IPA for TrollStore
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        run: |
          chmod +x build-ipa-macos.sh
          ./build-ipa-macos.sh 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show build output on failure
        if: failure()
        run: |
          find build -maxdepth 5 -type f | sort || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GateLAN-ipa
          path: GateLAN.ipa
          if-no-files-found: error
